      <path d="M0,0 L10,5 L0,10 z" fill="#d84315"/>
    </marker>
  </defs>
  <rect width="680" height="360" fill="#ffffff"/>
  <rect x="170" y="20" width="490" height="320" rx="18" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="415" y="44" text-anchor="middle" font-size="14" font-weight="600" fill="#004d40">People: awareness and training, personnel security</text>
  <rect x="210" y="60" width="410" height="240" rx="16" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
  <text x="415" y="84" text-anchor="middle" font-size="14" font-weight="600" fill="#004d40">Operational: policies, incident response, backups</text>
  <rect x="236" y="100" width="358" height="160" rx="14" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
  <text x="415" y="124" text-anchor="middle" font-size="13" font-weight="600" fill="#004d40">Technology: firewall, authentication, encryption</text>
  <rect x="300" y="142" width="230" height="80" rx="12" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <text x="415" y="177" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Protected information</text>
  <text x="415" y="198" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">or services</text>
  <rect x="14" y="160" width="110" height="44" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="69" y="187" text-anchor="middle" font-size="15" font-weight="600" fill="#263238">Adversary</text>
  <path d="M124,182 H234" stroke="#d84315" stroke-width="2.5" fill="none" marker-end="url(#ah2)"/>
  <g stroke="#d84315" stroke-width="3">
    <path d="M178,172 l12,20 M190,172 l-12,20"/>
