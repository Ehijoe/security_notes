<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Arial, sans-serif">
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">The ten best practices in four groups (grouping added by this site)</text>
  <!-- Who -->
  <rect x="20" y="46" width="350" height="128" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="38" y="76" font-size="15" font-weight="700" fill="#004d40">WHO gets in</text>
  <g font-size="14" fill="#263238">
    <text x="38" y="108">1  Apply proper access controls</text>
    <text x="38" y="134">5  Strengthen authentication</text>
  </g>
  <!-- Where -->
  <rect x="390" y="46" width="350" height="128" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
  <text x="408" y="76" font-size="15" font-weight="700" fill="#004d40">WHERE the database sits</text>
  <g font-size="14" fill="#263238">
    <text x="408" y="108">2  Separate database servers</text>
    <text x="408" y="134">4  Use database firewalls</text>
    <text x="408" y="160">9  Limit physical access</text>
  </g>
  <!-- What -->
  <rect x="20" y="190" width="350" height="128" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="38" y="220" font-size="15" font-weight="700" fill="#263238">WHAT is stored: protect the data itself</text>
  <g font-size="14" fill="#263238">
    <text x="38" y="252">3  Encrypt data in transit and at rest</text>
    <text x="38" y="278">7  Implement backup and disaster recovery</text>
  </g>
  <!-- Watch -->
  <rect x="390" y="190" width="350" height="128" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <text x="408" y="220" font-size="15" font-weight="700" fill="#263238">WATCH, fix and test</text>
  <g font-size="14" fill="#263238">
    <text x="408" y="252">6  Monitor database activity</text>
    <text x="408" y="278">8  Patch and update regularly</text>
    <text x="408" y="304">10  Conduct regular penetration testing</text>
  </g>
</svg>
