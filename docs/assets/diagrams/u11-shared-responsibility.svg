<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Inter, Arial, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#263238">Shared responsibility model for a cloud database</text>
  <!-- customer layers -->
  <rect x="40" y="50" width="420" height="52" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
  <text x="250" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Data</text>
  <rect x="40" y="112" width="420" height="52" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
  <text x="250" y="144" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Database user accounts</text>
  <rect x="40" y="174" width="420" height="52" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="250" y="206" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Access controls</text>
  <!-- provider -->
  <rect x="40" y="250" width="420" height="64" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <text x="250" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Physical infrastructure</text>
  <text x="250" y="298" text-anchor="middle" font-size="13" fill="#263238">(data centres, hardware, network)</text>
  <!-- brackets -->
  <path d="M478,52 h14 v172 h-14" stroke="#00796b" stroke-width="2.5" fill="none"/>
  <text x="504" y="128" font-size="15" font-weight="700" fill="#004d40">CUSTOMER secures</text>
  <text x="504" y="150" font-size="13" fill="#263238">also: customer-managed keys,</text>
  <text x="504" y="168" font-size="13" fill="#263238">backup and disaster recovery,</text>
  <text x="504" y="186" font-size="13" fill="#263238">trained security teams</text>
  <path d="M478,252 h14 v60 h-14" stroke="#455a64" stroke-width="2.5" fill="none"/>
  <text x="504" y="288" font-size="15" font-weight="700" fill="#263238">CLOUD PROVIDER secures</text>
  <!-- shared band -->
  <rect x="40" y="334" width="640" height="48" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="360" y="356" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Shared compliance obligations</text>
  <text x="360" y="374" text-anchor="middle" font-size="13" fill="#263238">met with access management software and auditing of database activity</text>
</svg>
