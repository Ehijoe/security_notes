<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="Inter, Arial, sans-serif">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker>
</defs>
<rect width="780" height="470" fill="#ffffff"/>
<!-- infrastructure -->
<rect x="16" y="30" width="130" height="56" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
<text x="81" y="63" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">Internet</text>
<rect x="196" y="30" width="160" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="276" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Border firewall</text>
<text x="276" y="73" text-anchor="middle" font-size="13" fill="#263238">and router</text>
<rect x="406" y="30" width="160" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="486" y="54" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Internal</text>
<text x="486" y="73" text-anchor="middle" font-size="13" fill="#263238">network core</text>
<path d="M146,58 H194" stroke="#455a64" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M356,58 H404" stroke="#455a64" stroke-width="2.5" marker-end="url(#ah)"/>
<!-- network-based sensor at boundary -->
<rect x="196" y="116" width="200" height="56" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
<text x="296" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Network-based</text>
<text x="296" y="159" text-anchor="middle" font-size="13" fill="#004d40">at the boundary</text>
<path d="M380,58 V114" stroke="#00796b" stroke-width="2" stroke-dasharray="5,4"/>
<!-- rogue wireless area -->
<rect x="606" y="22" width="158" height="78" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2" stroke-dasharray="6,4"/>
<text x="685" y="44" text-anchor="middle" font-size="13" fill="#263238">area where unauthorized</text>
<text x="685" y="62" text-anchor="middle" font-size="13" fill="#263238">wireless could occur</text>
<rect x="626" y="70" width="118" height="24" rx="8" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="685" y="87" text-anchor="middle" font-size="13" font-weight="700" fill="#004d40">Wireless sensor</text>
<!-- bus -->
<path d="M486,86 V200" stroke="#455a64" stroke-width="2.5"/>
<path d="M90,200 H700" stroke="#455a64" stroke-width="3"/>
<path d="M140,200 V226" stroke="#455a64" stroke-width="2.5"/>
<path d="M320,200 V226" stroke="#455a64" stroke-width="2.5"/>
<path d="M500,200 V226" stroke="#455a64" stroke-width="2.5"/>
<path d="M670,200 V226" stroke="#455a64" stroke-width="2.5"/>
<!-- hosts -->
<rect x="60" y="228" width="160" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="140" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Public web</text>
<text x="140" y="271" text-anchor="middle" font-size="13" fill="#263238">server</text>
<rect x="240" y="228" width="160" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="320" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Database server</text>
<text x="320" y="271" text-anchor="middle" font-size="13" fill="#263238">sensitive data</text>
<rect x="420" y="228" width="160" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="500" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Staff PCs</text>
<text x="500" y="271" text-anchor="middle" font-size="13" fill="#263238">internal clients</text>
<rect x="600" y="228" width="140" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
<text x="670" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Wireless</text>
<text x="670" y="271" text-anchor="middle" font-size="13" fill="#263238">access point</text>
<!-- agents -->
<rect x="60" y="300" width="160" height="40" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
<text x="140" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Host-based</text>
<rect x="240" y="300" width="160" height="40" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
<text x="320" y="325" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Host-based</text>
<!-- NBA -->
<rect x="420" y="300" width="160" height="56" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
<text x="500" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">NBA</text>
<text x="500" y="343" text-anchor="middle" font-size="13" fill="#004d40">watches internal flows</text>
<path d="M410,200 V328 H418" stroke="#00796b" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
<!-- wireless sensor -->
<rect x="600" y="300" width="140" height="56" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="2"/>
<text x="670" y="324" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Wireless</text>
<text x="670" y="343" text-anchor="middle" font-size="13" fill="#004d40">in range of WLAN</text>
<g stroke="#00796b" stroke-width="2" fill="none"><path d="M748,250 q10,6 0,12"/><path d="M754,244 q16,12 0,24"/></g>
<!-- legend -->
<rect x="16" y="380" width="748" height="80" rx="10" fill="#fafafa" stroke="#cfd8dc" stroke-width="1.5"/>
<rect x="32" y="396" width="22" height="16" rx="4" fill="#80cbc4" stroke="#00796b"/>
<text x="62" y="409" font-size="13" fill="#263238">IDPS types, placed where the courseware says each is most commonly deployed.</text>
<text x="32" y="432" font-size="13" fill="#263238">Network-based: boundary between networks. Wireless: within range of the WLAN. NBA: internal network flows</text>
<text x="32" y="450" font-size="13" fill="#263238">(sometimes flows to external networks). Host-based: critical hosts (public servers, servers with sensitive data).</text>
</svg>
