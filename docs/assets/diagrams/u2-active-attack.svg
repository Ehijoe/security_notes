<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="Inter, Arial, sans-serif">
<defs>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d84315"/></marker>
</defs>
<rect width="640" height="400" fill="#ffffff"/>
<ellipse cx="320" cy="290" rx="165" ry="68" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="320" y="300" text-anchor="middle" font-size="15" fill="#263238">Internet or</text>
<text x="320" y="319" text-anchor="middle" font-size="15" fill="#263238">another network</text>
<circle cx="320" cy="40" r="15" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
<rect x="300" y="60" width="40" height="56" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
<text x="352" y="82" font-size="15" font-weight="700" fill="#bf360c">Attacker</text>
<text x="352" y="100" font-size="13" fill="#bf360c">alters the transmission</text>
<circle cx="60" cy="222" r="15" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
<rect x="40" y="242" width="40" height="56" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
<text x="60" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">User A</text>
<circle cx="580" cy="222" r="15" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
<rect x="560" y="242" width="40" height="56" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
<text x="580" y="322" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">User B</text>
<line x1="90" y1="266" x2="190" y2="266" stroke="#455a64" stroke-width="2.5" marker-end="url(#ag)"/>
<line x1="250" y1="250" x2="306" y2="124" stroke="#d84315" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<line x1="334" y1="124" x2="390" y2="250" stroke="#d84315" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<line x1="450" y1="266" x2="550" y2="266" stroke="#455a64" stroke-width="2.5" marker-end="url(#ag)"/>
<text x="268" y="180" text-anchor="end" font-size="13" fill="#bf360c">1. intercepts</text>
<text x="268" y="196" text-anchor="end" font-size="13" fill="#bf360c">A's message</text>
<text x="372" y="172" font-size="13" fill="#bf360c">2. deletes, adds or alters,</text>
<text x="372" y="188" font-size="13" fill="#bf360c">replays, or creates a</text>
<text x="372" y="204" font-size="13" fill="#bf360c">false stream</text>
<text x="500" y="250" text-anchor="middle" font-size="13" fill="#455a64">3. B receives</text>
<text x="320" y="385" text-anchor="middle" font-size="13" fill="#455a64">The attacker sits in the path: what B receives is not what A sent.</text>
</svg>
