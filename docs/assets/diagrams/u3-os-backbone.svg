<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="u3a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d84315"/>
    </marker>
  </defs>
  <rect width="720" height="330" fill="#ffffff"/>
  <!-- stack -->
  <rect x="30" y="20" width="360" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <text x="210" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Users</text>
  <text x="210" y="65" text-anchor="middle" font-size="12" fill="#263238">people and the tasks they run</text>
  <rect x="30" y="88" width="360" height="56" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="210" y="114" text-anchor="middle" font-size="15" font-weight="700" fill="#004d40">Applications (software)</text>
  <text x="210" y="133" text-anchor="middle" font-size="12" fill="#004d40">browser, banking app, database, e-mail</text>
  <rect x="30" y="156" width="360" height="72" rx="10" fill="#37474f" stroke="#263238" stroke-width="2"/>
  <text x="210" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Operating system: the backbone</text>
  <text x="210" y="208" text-anchor="middle" font-size="13" fill="#ffffff">manages hardware and software resources</text>
  <rect x="30" y="240" width="360" height="56" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <text x="210" y="266" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Hardware</text>
  <text x="210" y="285" text-anchor="middle" font-size="12" fill="#263238">CPU, memory, disks, network card</text>
  <!-- compromise -->
  <rect x="450" y="20" width="250" height="40" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="575" y="45" text-anchor="middle" font-size="14" font-weight="700" fill="#bf360c">If the OS is compromised…</text>
  <path d="M390,192 C420,192 420,110 448,110" stroke="#d84315" stroke-width="2.5" fill="none" marker-end="url(#u3a1)"/>
  <path d="M390,192 C425,192 425,180 448,180" stroke="#d84315" stroke-width="2.5" fill="none" marker-end="url(#u3a1)"/>
  <path d="M390,192 C420,192 420,250 448,250" stroke="#d84315" stroke-width="2.5" fill="none" marker-end="url(#u3a1)"/>
  <rect x="450" y="85" width="250" height="50" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
  <text x="575" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">Unauthorized access</text>
  <rect x="450" y="155" width="250" height="50" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
  <text x="575" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">Data breaches</text>
  <rect x="450" y="225" width="250" height="50" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
  <text x="575" y="255" text-anchor="middle" font-size="15" font-weight="700" fill="#bf360c">System failures</text>
  <text x="575" y="305" text-anchor="middle" font-size="12" fill="#263238">every layer above the OS is exposed too</text>
</svg>
