<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="380" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">Asymmetric encryption</text>
  <g fill="none" stroke="#455a64" stroke-width="1.8" marker-end="url(#ah)">
    <path d="M140,95 H178"/>
    <path d="M300,95 H338"/>
    <path d="M440,95 H478"/>
    <path d="M600,95 H638"/>
    <path d="M240,190 V122"/>
    <path d="M540,190 V122"/>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="20" y="70" width="120" height="50" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="80" y="92" fill="#004d40">Plain Text</text>
    <text x="80" y="110" font-size="12" font-weight="400" fill="#263238">(sender)</text>
    <rect x="180" y="70" width="120" height="50" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
    <text x="240" y="100" fill="#004d40">encryption</text>
    <rect x="340" y="70" width="100" height="50" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
    <text x="390" y="100" fill="#263238">Cipher Text</text>
    <rect x="480" y="70" width="120" height="50" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
    <text x="540" y="100" fill="#bf360c">decryption</text>
    <rect x="640" y="70" width="110" height="50" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="695" y="92" fill="#004d40">Plain Text</text>
    <text x="695" y="110" font-size="12" font-weight="400" fill="#263238">(recipient)</text>
    <rect x="140" y="190" width="200" height="50" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="2"/>
    <text x="240" y="212" fill="#004d40">Public Key</text>
    <text x="240" y="230" font-size="12" font-weight="400" fill="#263238">recipient's: shared with anyone</text>
    <rect x="440" y="190" width="200" height="50" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="2"/>
    <text x="540" y="212" fill="#bf360c">Private Key</text>
    <text x="540" y="230" font-size="12" font-weight="400" fill="#263238">recipient's: kept secret</text>
  </g>
  <g font-size="13" fill="#263238" text-anchor="middle">
    <text x="390" y="215">key pair</text>
    <text x="390" y="232">(2 keys)</text>
  </g>
</svg>
