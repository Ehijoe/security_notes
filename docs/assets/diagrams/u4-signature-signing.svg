<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d84315"/>
    </marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <g fill="none" stroke-width="1.8">
    <path d="M150,75 H298" stroke="#455a64" marker-end="url(#ah)"/>
    <path d="M460,75 H608" stroke="#d84315" marker-end="url(#ahr)"/>
    <path d="M90,120 V210 H258" stroke="#455a64" stroke-dasharray="6 4" marker-end="url(#ah)"/>
    <path d="M675,110 V260 H462" stroke="#d84315" marker-end="url(#ahr)"/>
  </g>
  <g font-size="13" fill="#263238" text-anchor="middle">
    <text x="224" y="66">1. Hash</text>
    <text x="534" y="44">2. Encrypt with</text>
    <text x="534" y="62" font-weight="700" fill="#bf360c">sender's private key</text>
    <text x="175" y="200">copy of the document</text>
    <text x="715" y="190" text-anchor="middle">3. Append</text>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="30" y="30" width="120" height="90" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="90" y="72" fill="#004d40">Document</text>
    <text x="90" y="92" font-size="12" font-weight="400" fill="#263238">(to be signed)</text>
    <rect x="300" y="50" width="160" height="50" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
    <text x="380" y="80" fill="#263238">Message digest</text>
    <rect x="610" y="40" width="130" height="70" rx="35" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
    <text x="675" y="72" fill="#bf360c">DIGITAL</text>
    <text x="675" y="92" fill="#bf360c">SIGNATURE</text>
    <rect x="260" y="170" width="200" height="130" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="360" y="200" fill="#004d40">Document</text>
    <line x1="280" y1="215" x2="440" y2="215" stroke="#80cbc4" stroke-width="2"/>
    <line x1="280" y1="228" x2="420" y2="228" stroke="#80cbc4" stroke-width="2"/>
    <rect x="300" y="240" width="120" height="44" rx="22" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
    <text x="360" y="259" font-size="12" fill="#bf360c">DIGITAL</text>
    <text x="360" y="275" font-size="12" fill="#bf360c">SIGNATURE</text>
  </g>
  <text x="360" y="320" text-anchor="middle" font-size="13" fill="#263238">signed document = document + appended digital signature</text>
</svg>
