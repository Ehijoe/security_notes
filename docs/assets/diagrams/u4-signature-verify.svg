<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#455a64" stroke-width="1.8" marker-end="url(#ah)">
    <path d="M190,75 H358"/>
    <path d="M190,225 H358"/>
    <path d="M510,75 H580 V128"/>
    <path d="M510,225 H580 V172"/>
  </g>
  <g font-size="13" fill="#263238" text-anchor="middle">
    <text x="275" y="50">1. Hash the document</text>
    <text x="275" y="66" font-size="12">(excluding the signature)</text>
    <text x="275" y="200">2. Decrypt signature</text>
    <text x="275" y="216" font-weight="700" fill="#004d40">with sender's public key</text>
    <text x="680" y="140">3. Compare</text>
    <text x="680" y="170" fill="#004d40">equal: authentic</text>
    <text x="680" y="186" fill="#004d40">and intact</text>
    <text x="680" y="210" fill="#bf360c">different: reject</text>
  </g>
  <g font-size="15" font-weight="600" text-anchor="middle">
    <rect x="20" y="30" width="170" height="240" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
    <text x="105" y="62" fill="#004d40">Received signed</text>
    <text x="105" y="80" fill="#004d40">document</text>
    <line x1="40" y1="100" x2="170" y2="100" stroke="#80cbc4" stroke-width="2"/>
    <line x1="40" y1="114" x2="160" y2="114" stroke="#80cbc4" stroke-width="2"/>
    <line x1="40" y1="128" x2="170" y2="128" stroke="#80cbc4" stroke-width="2"/>
    <rect x="45" y="200" width="120" height="50" rx="25" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
    <text x="105" y="221" font-size="12" fill="#bf360c">DIGITAL</text>
    <text x="105" y="238" font-size="12" fill="#bf360c">SIGNATURE</text>
    <rect x="360" y="50" width="150" height="50" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
    <text x="435" y="80" fill="#263238">Message digest</text>
    <rect x="360" y="200" width="150" height="50" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
    <text x="435" y="230" fill="#263238">Message digest</text>
    <circle cx="580" cy="150" r="22" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="580" y="156" fill="#263238">= ?</text>
  </g>
</svg>
