<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="ah6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="840" height="330" fill="#ffffff"/>
  <rect x="15" y="40" width="260" height="210" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
  <text x="145" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#004d40">Trusted internal network</text>
  <g stroke-width="2">
    <rect x="35" y="60" width="100" height="40" rx="10" fill="#ffffff" stroke="#00796b"/>
    <rect x="155" y="60" width="100" height="40" rx="10" fill="#ffffff" stroke="#00796b"/>
    <rect x="35" y="120" width="100" height="40" rx="10" fill="#ffffff" stroke="#00796b"/>
    <rect x="155" y="120" width="100" height="40" rx="10" fill="#ffffff" stroke="#00796b"/>
    <rect x="35" y="180" width="220" height="50" rx="10" fill="#b2dfdb" stroke="#00796b"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#263238">
    <text x="85" y="85">PC</text><text x="205" y="85">Laptop</text>
    <text x="85" y="145">Phone</text><text x="205" y="145">Printer</text>
    <text x="145" y="203" font-weight="700">Servers, databases</text>
    <text x="145" y="221">(sensitive data)</text>
  </g>
  <rect x="345" y="40" width="150" height="210" rx="10" fill="#37474f"/>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#ffffff">
    <text x="420" y="110">FIREWALL</text>
  </g>
  <g font-size="13" text-anchor="middle" fill="#ffffff">
    <text x="420" y="140">checks each packet</text>
    <text x="420" y="158">against rules:</text>
    <text x="420" y="180">source/destination IP,</text>
    <text x="420" y="198">port number,</text>
    <text x="420" y="216">protocol type</text>
  </g>
  <rect x="565" y="40" width="260" height="210" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="695" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#bf360c">Untrusted external network</text>
  <g font-size="14" text-anchor="middle" fill="#263238">
    <text x="695" y="90" font-weight="700">The internet</text>
    <text x="695" y="125">Hackers, bots</text>
    <text x="695" y="150">Viruses, backdoors</text>
    <text x="695" y="175">Phishing emails</text>
    <text x="695" y="200">DoS attacks</text>
  </g>
  <g stroke="#455a64" stroke-width="2.5" marker-end="url(#ah6)">
    <line x1="563" y1="95" x2="499" y2="95"/>
    <line x1="343" y1="95" x2="279" y2="95"/>
    <line x1="279" y1="200" x2="343" y2="200"/>
    <line x1="499" y1="200" x2="563" y2="200"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#263238">
    <text x="530" y="85">inbound</text>
    <text x="310" y="85">allowed</text>
    <text x="310" y="190">outbound</text>
    <text x="530" y="190">allowed</text>
  </g>
  <rect x="15" y="270" width="810" height="50" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="420" y="291" font-size="13" text-anchor="middle" fill="#263238">Inbound filtering stops external threats; outbound rules restrict risky traffic from insiders</text>
  <text x="420" y="309" font-size="13" text-anchor="middle" fill="#263238">and help mitigate data exfiltration. Packets that fail the criteria are blocked in either direction.</text>
</svg>
