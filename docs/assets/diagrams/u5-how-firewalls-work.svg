<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" font-family="Inter, Arial, sans-serif">
  <rect width="860" height="430" fill="#ffffff"/>
  <text x="20" y="34" font-size="20" font-weight="700" fill="#263238">How Firewalls Work</text>
  <text x="20" y="56" font-size="14" fill="#455a64">First-Generation Firewall</text>
  <!-- cloud -->
  <g fill="#e0f2f1" stroke="#00796b" stroke-width="2">
    <path d="M400,110 a26,26 0 0 1 10,-48 a34,34 0 0 1 62,-10 a26,26 0 0 1 40,22 a20,20 0 0 1 -6,36 z"/>
  </g>
  <text x="455" y="95" font-size="14" font-weight="700" text-anchor="middle" fill="#004d40">Internet</text>
  <!-- attacker -->
  <rect x="270" y="62" width="100" height="40" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="2"/>
  <text x="320" y="87" font-size="14" font-weight="700" text-anchor="middle" fill="#bf360c">Attacker</text>
  <!-- link cloud to firewall -->
  <line x1="455" y1="112" x2="455" y2="150" stroke="#455a64" stroke-width="2"/>
  <!-- firewall -->
  <rect x="290" y="150" width="330" height="90" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="3" stroke-dasharray="2 0"/>
  <rect x="300" y="160" width="310" height="70" rx="6" fill="#ffffff" stroke="#d84315" stroke-width="1.5"/>
  <text x="455" y="186" font-size="15" font-weight="700" text-anchor="middle" fill="#263238">Packet filter/stateless firewall</text>
  <rect x="430" y="198" width="50" height="24" rx="4" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
  <text x="455" y="215" font-size="13" font-weight="700" text-anchor="middle" fill="#004d40">FTP</text>
  <!-- drawbacks box -->
  <rect x="20" y="140" width="235" height="110" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <g font-size="13" fill="#263238">
    <text x="34" y="170">✗ Needs additional configuration</text>
    <text x="34" y="200">✗ Fail to manage protocols</text>
    <text x="34" y="230">✗ "One-size-fits-all"</text>
  </g>
  <!-- policy doc -->
  <line x1="620" y1="195" x2="680" y2="195" stroke="#455a64" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="680" y="160" width="60" height="72" rx="6" fill="#cfd8dc" stroke="#455a64" stroke-width="2"/>
  <g stroke="#455a64" stroke-width="2">
    <line x1="692" y1="178" x2="728" y2="178"/>
    <line x1="692" y1="192" x2="728" y2="192"/>
    <line x1="692" y1="206" x2="728" y2="206"/>
    <line x1="692" y1="220" x2="716" y2="220"/>
  </g>
  <g font-size="13" fill="#263238">
    <text x="680" y="252">Additional</text>
    <text x="680" y="268">firewall policy for</text>
    <text x="680" y="284">return traffic</text>
  </g>
  <!-- tree to laptops -->
  <g stroke="#455a64" stroke-width="2" fill="none">
    <line x1="455" y1="240" x2="455" y2="300"/>
    <line x1="160" y1="300" x2="750" y2="300"/>
    <line x1="160" y1="300" x2="160" y2="325"/>
    <line x1="357" y1="300" x2="357" y2="325"/>
    <line x1="553" y1="300" x2="553" y2="325"/>
    <line x1="750" y1="300" x2="750" y2="325"/>
  </g>
  <g>
    <g transform="translate(160,0)">
      <rect x="-45" y="325" width="90" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
      <rect x="-60" y="381" width="120" height="8" rx="3" fill="#00796b"/>
      <circle cx="0" cy="353" r="10" fill="#d84315"/>
    </g>
    <g transform="translate(357,0)">
      <rect x="-45" y="325" width="90" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
      <rect x="-60" y="381" width="120" height="8" rx="3" fill="#00796b"/>
      <circle cx="0" cy="353" r="10" fill="#d84315"/>
    </g>
    <g transform="translate(553,0)">
      <rect x="-45" y="325" width="90" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
      <rect x="-60" y="381" width="120" height="8" rx="3" fill="#00796b"/>
      <circle cx="0" cy="353" r="10" fill="#d84315"/>
    </g>
    <g transform="translate(750,0)">
      <rect x="-45" y="325" width="90" height="56" rx="6" fill="#e0f2f1" stroke="#00796b" stroke-width="2"/>
      <rect x="-60" y="381" width="120" height="8" rx="3" fill="#00796b"/>
      <circle cx="0" cy="353" r="10" fill="#d84315"/>
    </g>
  </g>
  <text x="455" y="418" font-size="13" text-anchor="middle" fill="#bf360c">Internal computers: the red dot is the figure's "bug" (malware) icon on each one</text>
</svg>
