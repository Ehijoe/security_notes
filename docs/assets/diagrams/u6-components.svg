<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 445" width="900" height="445" font-family="Inter, Arial, sans-serif">
<rect width="900" height="445" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="96" rx="10" fill="#37474f" stroke="#263238" stroke-width="1.5"/>
<text x="450" y="46" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Foundation: the two components the courseware defines</text>
<rect x="40" y="58" width="400" height="46" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="240" y="78" font-size="14" font-weight="700" fill="#263238" text-anchor="middle">1  Policy Statement</text>
<text x="240" y="96" font-size="12" fill="#263238" text-anchor="middle">overarching security intentions and direction</text>
<rect x="460" y="58" width="400" height="46" rx="8" fill="#fff8e1" stroke="#f9a825"/>
<text x="660" y="78" font-size="14" font-weight="700" fill="#263238" text-anchor="middle">2  Roles and Responsibilities</text>
<text x="660" y="96" font-size="12" fill="#263238" text-anchor="middle">who is responsible (e.g. CISO, IT staff, employees)</text>
<rect x="20" y="140" width="280" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="160.0" y="166" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">Identity and access</text>
<text x="32" y="192" font-size="13" font-weight="700" fill="#00796b">3</text>
<text x="58" y="192" font-size="13" fill="#263238">Access control</text>
<text x="32" y="216" font-size="13" font-weight="700" fill="#00796b">4</text>
<text x="58" y="216" font-size="13" fill="#263238">Identification and authentication</text>
<text x="58" y="234" font-size="12" fill="#455a64">(incl. MFA and passwords)</text>
<text x="32" y="252" font-size="13" font-weight="700" fill="#00796b">7</text>
<text x="58" y="252" font-size="13" fill="#263238">Remote access</text>
<text x="32" y="276" font-size="13" font-weight="700" fill="#00796b">8</text>
<text x="58" y="276" font-size="13" fill="#263238">Acceptable use</text>
<rect x="310" y="140" width="280" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="450.0" y="166" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">Data protection</text>
<text x="322" y="192" font-size="13" font-weight="700" fill="#00796b">5</text>
<text x="348" y="192" font-size="13" fill="#263238">Data classification</text>
<text x="322" y="216" font-size="13" font-weight="700" fill="#00796b">6</text>
<text x="348" y="216" font-size="13" fill="#263238">Encryption</text>
<text x="322" y="240" font-size="13" font-weight="700" fill="#00796b">12</text>
<text x="348" y="240" font-size="13" fill="#263238">Backups</text>
<rect x="600" y="140" width="280" height="160" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="740.0" y="166" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">Systems and change</text>
<text x="612" y="192" font-size="13" font-weight="700" fill="#00796b">9</text>
<text x="638" y="192" font-size="13" fill="#263238">Patching</text>
<text x="612" y="216" font-size="13" font-weight="700" fill="#00796b">10</text>
<text x="638" y="216" font-size="13" fill="#263238">Malicious code protections</text>
<text x="612" y="240" font-size="13" font-weight="700" fill="#00796b">13</text>
<text x="638" y="240" font-size="13" fill="#263238">Server security (e.g. hardening)</text>
<text x="612" y="264" font-size="13" font-weight="700" fill="#00796b">15</text>
<text x="638" y="264" font-size="13" fill="#263238">Change management</text>
<rect x="20" y="320" width="425" height="96" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="232.5" y="346" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">People and place</text>
<text x="32" y="372" font-size="13" font-weight="700" fill="#00796b">11</text>
<text x="58" y="372" font-size="13" fill="#263238">Physical security</text>
<text x="32" y="396" font-size="13" font-weight="700" fill="#00796b">14</text>
<text x="58" y="396" font-size="13" fill="#263238">Employee on/off boarding</text>
<rect x="455" y="320" width="425" height="96" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="667.5" y="346" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">Detect and respond</text>
<text x="467" y="372" font-size="13" font-weight="700" fill="#00796b">16</text>
<text x="493" y="372" font-size="13" fill="#263238">Incidence Response</text>
<text x="467" y="396" font-size="13" font-weight="700" fill="#00796b">17</text>
<text x="493" y="396" font-size="13" fill="#263238">Monitoring and Auditing</text>
<text x="450" y="437" font-size="12" fill="#455a64" font-style="italic" text-anchor="middle">Numbers give each component's position in the courseware list. The grouping and group headings are added by this site.</text>
