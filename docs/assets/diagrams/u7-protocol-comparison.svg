<rect x="206" y="84" width="154" height="40" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="1.5"/>
<text x="283.0" y="110" text-anchor="middle" font-size="16" font-weight="700" fill="#004d40">WEP</text>
