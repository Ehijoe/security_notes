<text x="110.0" y="157.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Release Year</text>
<rect x="206" y="128" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="283.0" y="157.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">1997</text>
<rect x="366" y="128" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="443.0" y="157.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">2003</text>
<rect x="526" y="128" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="603.0" y="157.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">2004</text>
<rect x="686" y="128" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="763.0" y="157.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">2018</text>
<rect x="20" y="182" width="180" height="58" rx="10" fill="#37474f"/>
<text x="110.0" y="216.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Encryption</text>
<rect x="206" y="182" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="283.0" y="216.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">RC4</text>
<rect x="366" y="182" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="443.0" y="216.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">TKIP / RC4</text>
<rect x="526" y="182" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="603.0" y="216.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">AES-CCMP</text>
<rect x="686" y="182" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="763.0" y="207.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">AES-CCMP /</text>
<text x="763.0" y="224.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">AES-GCMP</text>
<rect x="20" y="246" width="180" height="48" rx="10" fill="#37474f"/>
<text x="110.0" y="275.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Session Key</text>
<rect x="206" y="246" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="283.0" y="275.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">64/128 bit</text>
<rect x="366" y="246" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="443.0" y="275.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">128 bit</text>
<rect x="526" y="246" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="603.0" y="275.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">128 bit</text>
<rect x="686" y="246" width="154" height="48" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="763.0" y="275.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">128/256 bit</text>
<rect x="20" y="300" width="180" height="58" rx="10" fill="#37474f"/>
<text x="110.0" y="334.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Authentication</text>
<rect x="206" y="300" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="283.0" y="325.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Open system,</text>
<text x="283.0" y="342.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">shared key</text>
<rect x="366" y="300" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="443.0" y="334.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Pre-shared key</text>
<rect x="526" y="300" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="603.0" y="334.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Pre-shared key</text>
<rect x="686" y="300" width="154" height="58" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="763.0" y="325.5" text-anchor="middle" font-size="14" font-weight="500" fill="#bf360c">AES-CCMP /</text>
<text x="763.0" y="342.5" text-anchor="middle" font-size="14" font-weight="500" fill="#bf360c">AES-GCMP *</text>
<rect x="20" y="364" width="180" height="48" rx="10" fill="#37474f"/>
<text x="110.0" y="393.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Level of Security</text>
<rect x="206" y="364" width="154" height="48" rx="10" fill="#ffccbc" stroke="#d84315" stroke-width="1.5"/>
<text x="283.0" y="393.0" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Very low</text>
<rect x="366" y="364" width="154" height="48" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="1.5"/>
<text x="443.0" y="393.0" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Low</text>
<rect x="526" y="364" width="154" height="48" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="603.0" y="393.0" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">Moderate</text>
<rect x="686" y="364" width="154" height="48" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="763.0" y="393.0" text-anchor="middle" font-size="14" font-weight="700" fill="#263238">High</text>
<rect x="20" y="418" width="180" height="76" rx="10" fill="#37474f"/>
<text x="110.0" y="461.0" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Weakness</text>
<rect x="206" y="418" width="154" height="76" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="283.0" y="444.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Insecure encryption</text>
<text x="283.0" y="461.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">easily exploited</text>
<text x="283.0" y="478.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">by hackers</text>
<rect x="366" y="418" width="154" height="76" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="443.0" y="452.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Weak encryption,</text>
<text x="443.0" y="469.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">compatibility issues</text>
<rect x="526" y="418" width="154" height="76" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="603.0" y="444.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Vulnerable to key</text>
<text x="603.0" y="461.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">reinstallation attack</text>
<text x="603.0" y="478.0" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">(KRACK)</text>
<rect x="686" y="418" width="154" height="76" rx="10" fill="#f5f7f8" stroke="#cfd8dc" stroke-width="1.5"/>
<text x="763.0" y="452.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">Complex</text>
<text x="763.0" y="469.5" text-anchor="middle" font-size="14" font-weight="500" fill="#263238">deployment</text>
<text x="20" y="520" font-size="13" fill="#bf360c">* As printed in the courseware: the WPA3 authentication cell repeats the encryption entry (see the Courseware note).</text>
<text x="20" y="538" font-size="13" fill="#455a64">Level-of-security colours added by this site.</text>
</svg>