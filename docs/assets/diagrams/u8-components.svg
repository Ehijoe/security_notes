<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" font-family="Inter, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker></defs>
<rect width="800" height="390" fill="#ffffff"/>
<g text-anchor="middle">
<rect x="15" y="40" width="110" height="70" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="1.5"/>
<text x="70" y="72" font-size="15" font-weight="700" fill="#263238">User</text>
<text x="70" y="92" font-size="12" fill="#263238">(or device)</text>
<rect x="165" y="25" width="200" height="100" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="265" y="52" font-size="15" font-weight="700" fill="#004d40">1. Authentication</text>
<text x="265" y="74" font-size="13" font-style="italic" fill="#004d40">"Who are you?"</text>
<text x="265" y="96" font-size="12" fill="#263238">passwords, biometric scans,</text>
<text x="265" y="112" font-size="12" fill="#263238">multi-factor authentication</text>
<rect x="405" y="25" width="200" height="100" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="505" y="52" font-size="15" font-weight="700" fill="#004d40">2. Authorization</text>
<text x="505" y="74" font-size="13" font-style="italic" fill="#004d40">"What level of access?"</text>
<text x="505" y="96" font-size="12" fill="#263238">to specific data or areas,</text>
<text x="505" y="112" font-size="12" fill="#263238">aligned with access policies</text>
<rect x="645" y="40" width="140" height="70" rx="10" fill="#cfd8dc" stroke="#455a64" stroke-width="1.5"/>
<text x="715" y="72" font-size="15" font-weight="700" fill="#263238">Resource</text>
<text x="715" y="92" font-size="12" fill="#263238">data, system, area</text>
</g>
<line x1="125" y1="75" x2="162" y2="75" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
<line x1="365" y1="75" x2="402" y2="75" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
<line x1="605" y1="75" x2="642" y2="75" stroke="#455a64" stroke-width="2" marker-end="url(#a)"/>
<g stroke="#f9a825" stroke-width="1.6" stroke-dasharray="5 4">
<line x1="265" y1="125" x2="265" y2="165"/><line x1="505" y1="125" x2="505" y2="165"/><line x1="715" y1="110" x2="715" y2="165"/>
</g>
<rect x="165" y="165" width="620" height="66" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="475" y="192" font-size="15" font-weight="700" fill="#263238" text-anchor="middle">3. Audit and monitoring</text>
<text x="475" y="214" font-size="13" fill="#263238" text-anchor="middle">audit trails track user activity: detect unauthorized access, identify vulnerabilities</text>
<rect x="15" y="255" width="375" height="115" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="202" y="282" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">4. Access management</text>
<text x="202" y="304" font-size="13" fill="#263238" text-anchor="middle">the account lifecycle:</text>
<text x="202" y="326" font-size="13" fill="#263238" text-anchor="middle">onboarding → active accounts kept</text>
<text x="202" y="344" font-size="13" fill="#263238" text-anchor="middle">secure and up to date → offboarding</text>
<rect x="410" y="255" width="375" height="115" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="597" y="282" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">5. Integration</text>
<text x="597" y="304" font-size="13" fill="#263238" text-anchor="middle">works seamlessly with:</text>
<text x="597" y="326" font-size="13" fill="#263238" text-anchor="middle">cloud environments, identity management</text>
<text x="597" y="344" font-size="13" fill="#263238" text-anchor="middle">tools, other security solutions</text>
</svg>
