<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Inter, Arial, sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<g stroke="#455a64" stroke-width="1.6" stroke-dasharray="5 4">
<line x1="400" y1="190" x2="140" y2="140"/><line x1="400" y1="190" x2="400" y2="140"/><line x1="400" y1="190" x2="660" y2="140"/>
<line x1="400" y1="260" x2="270" y2="310"/><line x1="400" y1="260" x2="530" y2="310"/>
</g>
<rect x="260" y="185" width="280" height="80" rx="10" fill="#37474f"/>
<text x="400" y="214" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Access request</text>
<text x="400" y="236" font-size="13" fill="#ffffff" text-anchor="middle">"Can Ada open the payroll file?"</text>
<text x="400" y="254" font-size="12" fill="#cfd8dc" text-anchor="middle">each model asks a different question</text>
<g font-size="13" fill="#263238" text-anchor="middle">
<rect x="15" y="20" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="140" y="46" font-size="15" font-weight="700" fill="#004d40">DAC (discretionary)</text>
<text x="140" y="72">Has the file's owner decided</text>
<text x="140" y="90">to grant Ada access?</text>
<text x="140" y="122" font-size="12" font-style="italic" fill="#455a64">Set by: the data owner</text>
<rect x="275" y="20" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="400" y="46" font-size="15" font-weight="700" fill="#004d40">MAC (mandatory)</text>
<text x="400" y="72">Does Ada's clearance fit the</text>
<text x="400" y="90">file's label (e.g. "secret")?</text>
<text x="400" y="122" font-size="12" font-style="italic" fill="#455a64">Set by: one person, e.g. the CSO</text>
<rect x="535" y="20" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="660" y="46" font-size="15" font-weight="700" fill="#004d40">RBAC (role-based)</text>
<text x="660" y="72">Does Ada's job function (role)</text>
<text x="660" y="90">require this file?</text>
<text x="660" y="122" font-size="12" font-style="italic" fill="#455a64">Set by: admins, per group/role</text>
<rect x="145" y="310" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="270" y="336" font-size="15" font-weight="700" fill="#004d40">ABAC (attribute-based)</text>
<text x="270" y="362">Do Ada's attributes, in this</text>
<text x="270" y="380">context and risk level, allow it?</text>
<text x="270" y="412" font-size="12" font-style="italic" fill="#455a64">Set by: owner or administrator</text>
<rect x="405" y="310" width="250" height="120" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
<text x="530" y="336" font-size="15" font-weight="700" fill="#004d40">RuBAC (rule-based)</text>
<text x="530" y="362">Does a rule allow it? e.g. "only</text>
<text x="530" y="380">finance staff see financial data"</text>
<text x="530" y="412" font-size="12" font-style="italic" fill="#455a64">Set by: rules defined for the resource</text>
</g>
</svg>
