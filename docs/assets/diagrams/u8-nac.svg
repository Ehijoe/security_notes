<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="Inter, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#455a64"/></marker>
<marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d84315"/></marker></defs>
<rect width="900" height="420" fill="#ffffff"/>
<g text-anchor="middle" font-size="13" fill="#263238">
<rect x="15" y="40" width="150" height="40" rx="10" fill="#cfd8dc" stroke="#455a64"/><text x="90" y="65">Employee laptop</text>
<rect x="15" y="95" width="150" height="40" rx="10" fill="#cfd8dc" stroke="#455a64"/><text x="90" y="120">BYOD phone</text>
<rect x="15" y="150" width="150" height="40" rx="10" fill="#cfd8dc" stroke="#455a64"/><text x="90" y="175">IoT device</text>
<rect x="15" y="205" width="150" height="40" rx="10" fill="#cfd8dc" stroke="#455a64"/><text x="90" y="230">Guest / contractor</text>
</g>
<g stroke="#455a64" stroke-width="1.6">
<line x1="165" y1="60" x2="208" y2="110" marker-end="url(#a)"/><line x1="165" y1="115" x2="208" y2="128" marker-end="url(#a)"/>
<line x1="165" y1="170" x2="208" y2="150" marker-end="url(#a)"/><line x1="165" y1="225" x2="208" y2="170" marker-end="url(#a)"/>
</g>
<rect x="210" y="40" width="170" height="210" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="1.8"/>
<g text-anchor="middle" fill="#004d40">
<text x="295" y="68" font-size="15" font-weight="700">NAC</text>
<text x="295" y="90" font-size="14" font-weight="700">Pre-admission</text>
<text x="295" y="114" font-size="13">request to enter</text>
<text x="295" y="134" font-size="13">is considered:</text>
<text x="295" y="156" font-size="13">user authenticated?</text>
<text x="295" y="176" font-size="13">device authorized</text>
<text x="295" y="196" font-size="13">and compliant?</text>
<text x="295" y="222" font-size="12" font-style="italic">(e.g. password + MFA)</text>
</g>
<line x1="295" y1="250" x2="295" y2="303" stroke="#d84315" stroke-width="1.8" marker-end="url(#o)"/>
<text x="305" y="282" font-size="12" fill="#bf360c">fails / suspicious</text>
<rect x="210" y="305" width="170" height="70" rx="10" fill="#fbe9e7" stroke="#d84315" stroke-width="1.5"/>
<text x="295" y="332" font-size="14" font-weight="700" fill="#bf360c" text-anchor="middle">Denied or isolated</text>
<text x="295" y="354" font-size="12" fill="#bf360c" text-anchor="middle">stops spread of an attack</text>
<rect x="410" y="20" width="475" height="380" rx="10" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="647" y="44" font-size="15" font-weight="700" fill="#004d40" text-anchor="middle">Corporate or private network</text>
<line x1="380" y1="110" x2="428" y2="110" stroke="#455a64" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="380" y1="200" x2="428" y2="225" stroke="#455a64" stroke-width="1.8" marker-end="url(#a)"/>
<g text-anchor="middle">
<rect x="430" y="70" width="150" height="80" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="505" y="100" font-size="14" font-weight="700" fill="#004d40">Staff area</text>
<text x="505" y="122" font-size="12" fill="#263238">role-based access</text>
<text x="505" y="138" font-size="12" fill="#263238">by job function</text>
<rect x="430" y="195" width="150" height="80" rx="10" fill="#b2dfdb" stroke="#00796b" stroke-width="1.5"/>
<text x="505" y="225" font-size="14" font-weight="700" fill="#004d40">Guest area</text>
<text x="505" y="247" font-size="12" fill="#263238">contractors, partners,</text>
<text x="505" y="263" font-size="12" fill="#263238">guests: restricted</text>
<rect x="600" y="78" width="110" height="64" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
<text x="655" y="100" font-size="13" font-weight="700" fill="#263238">Post-admission</text>
<text x="655" y="118" font-size="12" fill="#263238">verify identity</text>
<text x="655" y="133" font-size="12" fill="#263238">again</text>
<rect x="730" y="70" width="140" height="80" rx="10" fill="#80cbc4" stroke="#00796b" stroke-width="1.5"/>
<text x="800" y="100" font-size="14" font-weight="700" fill="#004d40">New / different</text>
<text x="800" y="118" font-size="14" font-weight="700" fill="#004d40">area</text>
<text x="800" y="138" font-size="12" fill="#263238">e.g. finance servers</text>
</g>
<line x1="580" y1="110" x2="597" y2="110" stroke="#455a64" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="710" y1="110" x2="727" y2="110" stroke="#455a64" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="430" y="300" width="440" height="85" rx="10" fill="#ffffff" stroke="#00796b"/>
<text x="650" y="324" font-size="13" font-weight="700" fill="#004d40" text-anchor="middle">NAC keeps watching after entry</text>
<text x="650" y="346" font-size="12" fill="#263238" text-anchor="middle">perpetual inventory of users, devices and their level of access;</text>
<text x="650" y="364" font-size="12" fill="#263238" text-anchor="middle">active discovery of unknown devices; detects unusual activity;</text>
<text x="650" y="380" font-size="12" fill="#263238" text-anchor="middle">automates incident response; reports on attempted access</text>
</svg>
